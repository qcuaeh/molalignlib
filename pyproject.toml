[build-system]
requires = [
  "scikit-build-core>=0.10",
  "cython>=3.0",
  "numpy>=1.19.2",
]
build-backend = "scikit_build_core.build"

[project]
name = "molalignlib"
version = "0.1.0"
description = "Python bindings for MolAlignLib via Cython"
requires-python = ">=3.6"
dependencies = [
  "numpy",
  "chemfiles",
]

[tool.scikit-build]
# No package directories: the whole interface is the single extension
# module molalignlib.<abi>.so, installed at the wheel root by CMake
# (bindings/python/CMakeLists.txt).
wheel.packages = []
